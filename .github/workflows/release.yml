name: Build & Publish macOS Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to publish (e.g. v2.0.0)'
        required: false

permissions:
  contents: write

jobs:
  build-macos-arm64:
    name: Build Signed macOS Apple Silicon App & Publish Release
    runs-on: macos-14
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Install Standalone Python 3.14 (arm64)
        run: uv python install 3.14

      - name: Build Frontend, Backend & Native Swift App Bundle
        env:
          APP_DIR: ${{ runner.temp }}/OmniVault.app
          SOURCE_DIR: ${{ github.workspace }}
        run: |
          chmod +x ./build_app.sh
          ./build_app.sh

      - name: Verify Code Signature & Bundle Hygiene
        run: |
          codesign --verify --verbose "${{ runner.temp }}/OmniVault.app"
          PYCACHE_COUNT=$(find "${{ runner.temp }}/OmniVault.app" -type d -name "__pycache__" | wc -l | tr -d ' ')
          echo "PYCACHE_COUNT=$PYCACHE_COUNT"
          test "$PYCACHE_COUNT" -eq 0

      - name: Package Zip Archive & SHA-256 Checksum
        env:
          TAG_NAME: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          mkdir -p "${{ runner.temp }}/dist"
          ASSET_NAME="OmniVault-${TAG_NAME}-macOS-arm64.zip"
          ditto -c -k --keepParent "${{ runner.temp }}/OmniVault.app" "${{ runner.temp }}/dist/${ASSET_NAME}"
          cd "${{ runner.temp }}/dist"
          shasum -a 256 "${ASSET_NAME}" > SHA256SUMS.txt
          cat SHA256SUMS.txt
          echo "ASSET_PATH=${{ runner.temp }}/dist/${ASSET_NAME}" >> "$GITHUB_ENV"
          echo "SUMS_PATH=${{ runner.temp }}/dist/SHA256SUMS.txt" >> "$GITHUB_ENV"
          echo "RELEASE_TAG=${TAG_NAME}" >> "$GITHUB_ENV"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: OmniVault ${{ env.RELEASE_TAG }} — Multi-System Finder, Cloud Destinations & Exact-Game Scrapers
          generate_release_notes: true
          body: |
            ## OmniVault ${{ env.RELEASE_TAG }} (macOS Apple Silicon)

            ### Highlights
            - **Direct Cloud Storage Downloads**: Save and extract ROMs & games straight to **iCloud Drive**, **Google Drive**, or **OneDrive** (zero-auth native sync mounts + Google Drive v3 / OneDrive Graph chunked REST API uploads).
            - **Strict In-App Community Scrapers**: Clicking any configured community source scrapes & queues downloads **inside OmniVault** (never opening external browser redirects), backed by exact-game title, sequel-number, and non-file-hoster filtering.
            - **39 Platforms + Zero-Quota Full Catalog Sync**: Supports classic arcade/consoles through **PS5**, **Nintendo Switch 2**, **Windows (PC)**, and **macOS**, with 1-click **Sync All Platforms** (`122k+` titles via TheGamesDB static CDN dump, zero API quota).
            - **Real-Debrid 280+ Hoster Unlock & Live Health Monitor**: Token validation + dynamic hoster domain sync, Base/Update/DLC/Backport classification, and **Test All Sources**.
            - **Inline Trailers & Gameplay + 1-at-a-Time Sequential Queue**: YouTube trailers & gameplay tabs in game details, sequential download queue (reorder/pause/resume/clear), `.chd`/`.rvz` compression, and `CRC32`/`SHA1`/`MD5` verification.
          files: |
            ${{ env.ASSET_PATH }}
            ${{ env.SUMS_PATH }}
