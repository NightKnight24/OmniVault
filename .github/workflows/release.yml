name: Build & Publish macOS Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to publish (e.g. v2.0.0)'
        required: false

permissions:
  contents: write

jobs:
  build-macos-arm64:
    name: Build Signed macOS Apple Silicon App & Publish Release
    runs-on: macos-15
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Install Standalone Python 3.14 (arm64)
        run: uv python install 3.14

      - name: Build Frontend, Backend & Native Swift App Bundle
        env:
          APP_DIR: ${{ runner.temp }}/OmniVault.app
          SOURCE_DIR: ${{ github.workspace }}
        run: |
          chmod +x ./build_app.sh
          ./build_app.sh

      - name: Verify Code Signature & Bundle Hygiene
        run: |
          PYTHONDONTWRITEBYTECODE=1 SSL_CERT_FILE=/etc/ssl/cert.pem "${{ runner.temp }}/OmniVault.app/Contents/Resources/python/bin/python3.14" -B -c "import sys; sys.path.insert(0, '${{ runner.temp }}/OmniVault.app/Contents/Resources/backend'); import app.main; print('CI_BACKEND_IMPORT_OK')"
          codesign --verify --verbose "${{ runner.temp }}/OmniVault.app"
          PYCACHE_COUNT=$(find "${{ runner.temp }}/OmniVault.app" -type d -name "__pycache__" | wc -l | tr -d ' ')
          echo "PYCACHE_COUNT=$PYCACHE_COUNT"
          test "$PYCACHE_COUNT" -eq 0

      - name: Package Zip Archive & SHA-256 Checksum
        env:
          TAG_NAME: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          mkdir -p "${{ runner.temp }}/dist"
          ASSET_NAME="OmniVault-${TAG_NAME}-macOS-arm64.zip"
          ditto -c -k --keepParent "${{ runner.temp }}/OmniVault.app" "${{ runner.temp }}/dist/${ASSET_NAME}"
          cd "${{ runner.temp }}/dist"
          shasum -a 256 "${ASSET_NAME}" > SHA256SUMS.txt
          cat SHA256SUMS.txt
          echo "ASSET_PATH=${{ runner.temp }}/dist/${ASSET_NAME}" >> "$GITHUB_ENV"
          echo "SUMS_PATH=${{ runner.temp }}/dist/SHA256SUMS.txt" >> "$GITHUB_ENV"
          echo "RELEASE_TAG=${TAG_NAME}" >> "$GITHUB_ENV"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: OmniVault ${{ env.RELEASE_TAG }} — 150+ System TheGamesDB Organizer, Cloud Sign-In & Zero-Disk Streaming
          generate_release_notes: true
          body: |
            ## OmniVault ${{ env.RELEASE_TAG }} (macOS Apple Silicon)

            ### Highlights
            - **Full 150+ System TheGamesDB Catalog & Metadata Organizer**: Zero-quota **Resync Catalog** downloads all `130k+` titles across **150+ systems** (including **Switch 2**, **PS5**, **Xbox Series X/S**, **Xbox One**, **Windows**, **macOS**, **Amiga**, **3DO**, classic consoles & handhelds) with multi-category genres, **8,700+ developers**, **4,700+ publishers**, ESRB ratings, multiplayer/co-op counts, verified front box art, 1080p fanart backdrops, and screenshots — all filterable in `<15ms`.
            - **Cloud Sign-In & Zero-Local-Disk Direct Streaming (`iCloud` • `Google Drive` • `OneDrive`)**: Connect via **1-click Desktop App / System Sign-In** or **OAuth 2.0 PKCE Browser "Sign in & Allow"**, streaming ROMs & Real-Debrid downloads directly through RAM into dedicated `OmniVault/ROMs/<Console>/` subfolders with **0 bytes written to the local drive** (plus optional iCloud offload after sync).
            - **Instant Filtering & Anti-Cache Reliability**: Debounced abortable queries, `Cache-Control: no-store` protection for `WKWebView`, and 1-click **Refresh** & **Resync Catalog** controls right in the main Catalog toolbar.
            - **Strict In-App Community Scrapers & Real-Debrid 280+ Hoster Unlock**: Exact-game title matching, inline YouTube trailers & gameplay, **Test All Sources**, and a 1-at-a-time sequential download queue.
          files: |
            ${{ env.ASSET_PATH }}
            ${{ env.SUMS_PATH }}
